    post:
      tags:
      - Apps
      summary: Schedule an Application
      description: Schedule a application to be run on demand.
      operationId: scheduleApplication
      parameters:
      - name: name
        in: path
        description: Name of the App
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '404':
          description: Application for instance {id} is not found
  /v1/apps/stop/{name}:
    post:
      tags:
      - Apps
      summary: Stop a Application run
      description: Stop a application run by name.
      operationId: stopApplicationRun
      parameters:
      - name: name
        in: path
        description: Name of the App
        required: true
        schema:
          type: string
      - name: runId
        in: query
        description: Pipeline run ID to stop a specific run
        schema:
          type: string
      responses:
        '200':
          description: Application stopped status code
          content:
            application/json: {}
        '404':
          description: Application for instance {id} is not found
  /v1/apps/trigger/{name}:
    post:
      tags:
      - Apps
      summary: Trigger an Application run
      description: Trigger a Application run by name.
      operationId: triggerApplicationRun
      parameters:
      - name: name
        in: path
        description: Name of the App
        required: true
        schema:
          type: string
      requestBody:
        description: Configuration payload. Keys will be added to the current configuration. Delete keys by setting them to null.
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
      responses:
        '200':
          description: Application trigger status code
          content:
            application/json: {}
        '404':
          description: Application for instance {id} is not found
