          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        downVoters:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
    DatabaseConnection:
      type: object
      properties:
        config:
          type: object
    TagLabel:
      required:
