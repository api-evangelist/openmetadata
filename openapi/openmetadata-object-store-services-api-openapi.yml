openapi: 3.0.1
info:
  title: OpenMetadata APIs Agent Executions Object Store Services API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.13'
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Object Store Services
  description: APIs related `Object Store Service` entities, such as S3, GCS or AZURE.
paths:
  /v1/services/storageServices/{id}/followers:
    put:
      tags:
      - Object Store Services
      summary: Add a follower
      description: Add a user identified by `userId` as followed of this Storage service
      operationId: addFollowerToDatabaseService_4
      parameters:
      - name: id
        in: path
        description: Id of the Storage Service
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: Storage Service for instance {id} is not found
  /v1/services/storageServices/{id}/testConnectionResult:
    put:
      tags:
      - Object Store Services
      summary: Add test connection result
      description: Add test connection result to the service.
      operationId: addTestConnectionResult_12
      parameters:
      - name: id
        in: path
        description: Id of the service
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionResult'
      responses:
        '200':
          description: Successfully updated the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseService'
  /v1/services/storageServices:
    get:
      tags:
      - Object Store Services
      summary: List storage services
      description: Get a list of storage services.
      operationId: listStorageServices
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: pipelines,owners,tags,domains,followers
      - name: domain
        in: query
        description: Filter services by domain
        schema:
          type: string
          example: Marketing
      - name: limit
        in: query
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of storage services before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of storage services after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: List of storage service instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageServiceList'
    put:
      tags:
      - Object Store Services
      summary: Update storage service
      description: Update an existing or create a new storage service.
      operationId: createOrUpdateStorageService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStorageService'
      responses:
        '200':
          description: Object store service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageService'
        '400':
          description: Bad request
    post:
      tags:
      - Object Store Services
      summary: Create storage service
      description: Create a new storage service.
      operationId: createStorageService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStorageService'
      responses:
        '200':
          description: Object store service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageService'
        '400':
          description: Bad request
  /v1/services/storageServices/name/{fqn}:
    delete:
      tags:
      - Object Store Services
      summary: Delete an StorageService by fully qualified name
      description: Delete an StorageService by `fullyQualifiedName`.
      operationId: deleteStorageServiceByFQN
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: fqn
        in: path
        description: Name of the StorageService
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: StorageService for instance {fqn} is not found
    patch:
      tags:
      - Object Store Services
      summary: Update an storage service by FQN
      description: Update an existing storage service using JsonPatch by FQN.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchStorageServiceByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the storage service
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/services/storageServices/{id}:
    get:
      tags:
      - Object Store Services
      summary: Get an storage service
      description: Get an storage service by `id`.
      operationId: getStorageServiceByID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: pipelines,owners,tags,domains,followers
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: Object store service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageService'
        '404':
          description: Object store service for instance {id} is not found
    delete:
      tags:
      - Object Store Services
      summary: Delete an storage service
      description: Delete an storage services. If containers belong the service, it can't be deleted.
      operationId: deleteStorageService
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the storage service
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: StorageService service for instance {id} is not found
    patch:
      tags:
      - Object Store Services
      summary: Update an storage service
      description: Update an existing storage service using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchStorageService
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/services/storageServices/async/{id}:
    delete:
      tags:
      - Object Store Services
      summary: Asynchronously delete an storage service
      description: Asynchronously delete an storage services. If containers belong the service, it can't be deleted.
      operationId: deleteStorageServiceAsync
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the storage service
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: StorageService service for instance {id} is not found
  /v1/services/storageServices/{id}/followers/{userId}:
    delete:
      tags:
      - Object Store Services
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the entity.
      operationId: deleteFollower_27
      parameters:
      - name: id
        in: path
        description: Id of the Entity
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/services/storageServices/name/{name}:
    get:
      tags:
      - Object Store Services
      summary: Get storage service by name
      description: Get a storage service by the service `name`.
      operationId: getStorageServiceByFQN
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: pipelines,owners,tags,domains,followers
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: Object store service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageService'
        '404':
          description: Object store service for instance {id} is not found
  /v1/services/storageServices/{id}/versions/{version}:
    get:
      tags:
      - Object Store Services
      summary: Get a version of the storage service
      description: Get a version of the storage service by given `id`
      operationId: getSpecificStorageServiceVersion
      parameters:
      - name: id
        in: path
        description: storage service Id
        required: true
        schema:
          type: string
      - name: version
        in: path
        description: storage service version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: storage service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageService'
        '404':
          description: Object store service for instance {id} and version {version} is not found
  /v1/services/storageServices/history:
    get:
      tags:
      - Object Store Services
      summary: List all entity versions within a time range
      description: 'Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch. '
      operationId: listAllEntityVersionsByTimestamp_53
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/services/storageServices/{id}/versions:
    get:
      tags:
      - Object Store Services
      summary: List storage service versions
      description: Get a list of all the versions of an storage service identified by `id`
      operationId: listAllStorageServiceVersion
      parameters:
      - name: id
        in: path
        description: storage service Id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of storage service versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/services/storageServices/restore:
    put:
      tags:
      - Object Store Services
      summary: Restore a soft deleted StorageService.
      description: Restore a soft deleted StorageService.
      operationId: restore_43
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: Successfully restored the StorageService.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageService'
components:
  schemas:
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    StorageService:
      required:
      - id
      - name
      - serviceType
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::).)*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        serviceType:
          type: string
          enum:
          - S3
          - ADLS
          - GCS
          - CustomStorage
        description:
          type: string
        connection:
          $ref: '#/components/schemas/StorageConnection'
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        testConnectionResult:
          $ref: '#/components/schemas/TestConnectionResult'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        version:
          type: number
          format: double
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
        impersonatedBy:
          type: string
        href:
          type: string
          format: uri
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        deleted:
          type: boolean
        entityStatus:
          type: string
          enum:
          - Draft
          - In Review
          - Approved
          - Archived
          - Deprecated
          - Rejected
          - Unprocessed
        dataProducts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataContract:
          $ref: '#/components/schemas/EntityReference'
        followers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        ingestionRunner:
          $ref: '#/components/schemas/EntityReference'
        provider:
          type: string
          enum:
          - system
          - user
          - automation
        extension:
          type: object
        children:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        service:
          $ref: '#/components/schemas/EntityReference'
        style:
          $ref: '#/components/schemas/Style'
        experts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        usageSummary:
          $ref: '#/components/schemas/UsageDetails'
        votes:
          $ref: '#/components/schemas/Votes'
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        certification:
          $ref: '#/components/schemas/AssetCertification'
    DatabaseService:
      required:
      - id
      - name
      - serviceType
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::).)*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        serviceType:
          type: string
          enum:
          - BigQuery
          - BigTable
          - Mysql
          - Redshift
          - Snowflake
          - Postgres
          - Timescale
          - Mssql
          - MicrosoftAccess
          - Oracle
          - Athena
          - Hive
          - Impala
          - Presto
          - Trino
          - Vertica
          - Glue
          - MariaDB
          - Druid
          - Db2
          - Clickhouse
          - Databricks
          - AzureSQL
          - DynamoDB
          - SingleStore
          - SQLite
          - DeltaLake
          - Salesforce
          - PinotDB
          - Datalake
          - DomoDatabase
          - QueryLog
          - CustomDatabase
          - Dbt
          - SapHana
          - SapSuccessFactors
          - MongoDB
          - Cassandra
          - Couchbase
          - Greenplum
          - Doris
          - StarRocks
          - UnityCatalog
          - SAS
          - Teradata
          - SapErp
          - Synapse
          - Exasol
          - Cockroach
          - SSAS
          - Epic
          - ServiceNow
          - Dremio
          - MicrosoftFabric
          - BurstIQ
          - Informix
          - Iomete
          - QuestDB
        description:
          type: string
        connection:
          $ref: '#/components/schemas/DatabaseConnection'
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        testConnectionResult:
          $ref: '#/components/schemas/TestConnectionResult'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        version:
          type: number
          format: double
        updatedAt:
          type: integer
          format: int64
        updatedBy:
          type: string
        impersonatedBy:
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        href:
          type: string
          format: uri
        followers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        deleted:
          type: boolean
        entityStatus:
          type: string
          enum:
          - Draft
          - In Review
          - Approved
          - Archived
          - Deprecated
          - Rejected
          - Unprocessed
        dataProducts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataContract:
          $ref: '#/components/schemas/EntityReference'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        ingestionRunner:
          $ref: '#/components/schemas/EntityReference'
        provider:
          type: string
          enum:
          - system
          - user
          - automation
        extension:
          type: object
        children:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        service:
          $ref: '#/components/schemas/EntityReference'
        style:
          $ref: '#/components/schemas/Style'
        experts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        usageSummary:
          $ref: '#/components/schemas/UsageDetails'
        votes:
          $ref: '#/components/schemas/Votes'
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
        certification:
          $ref: '#/components/schemas/AssetCertification'
    ChangeSummaryMap:
      type: object
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    FieldChange:
      type: object
      properties:
        name:
          type: string
        oldValue:
          type: object
        newValue:
          type: object
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    LifeCycle:
      type: object
      properties:
        created:
          $ref: '#/components/schemas/AccessDetails'
        updated:
          $ref: '#/components/schemas/AccessDetails'
        accessed:
          $ref: '#/components/schemas/AccessDetails'
    EntityHistory:
      required:
      - entityType
      - versions
      type: object
      properties:
        entityType:
          type: string
        versions:
          type: array
          items:
            type: object
    AssetCertification:
      required:
      - appliedDate
      - expiryDate
      - tagLabel
      type: object
      properties:
        tagLabel:
          $ref: '#/components/schemas/TagLabel'
        appliedDate:
          type: integer
          format: int64
        expiryDate:
          type: integer
          format: int64
    ResultList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    TestConnectionResult:
      required:
      - steps
      type: object
      properties:
        lastUpdatedAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - Successful
          - Failed
          - Running
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TestConnectionStepResult'
    JsonPatch:
      type: object
    ChangeDescription:
      type: object
      properties:
        fieldsAdded:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsUpdated:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsDeleted:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        previousVersion:
          type: number
          format: double
        changeSummary:
          $ref: '#/components/schemas/ChangeSummaryMap'
    StorageServiceList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StorageService'
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
