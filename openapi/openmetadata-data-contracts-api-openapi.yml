  /v1/dataContracts/{id}/validate:
    post:
      tags:
      - Data Contracts
      summary: Validate a data contract
      description: Execute on-demand validation of a data contract including semantic rules, quality tests, and inherited contract properties from data products.
      operationId: validateDataContract
      parameters:
      - name: id
        in: path
        description: Id of the data contract
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContractResult'
        '404':
          description: Data contract not found
  /v1/dataContracts/entity/validate:
    post:
      tags:
      - Data Contracts
      summary: Validate a data contract for an entity
      description: Execute on-demand validation of a data contract for an entity. If the entity only has an inherited contract from a Data Product, an empty contract will be materialized for the entity to store validation results.
      operationId: validateDataContractByEntityId
      parameters:
      - name: entityId
        in: query
        description: ID of the entity
        schema:
          type: string
          format: uuid
      - name: entityType
        in: query
        description: Type of the entity
        schema:
          type: string
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContractResult'
        '404':
          description: Entity not found or no contract available
  /v1/dataContracts/validate:
    post:
      tags:
      - Data Contracts
      summary: Validate data contract request without creating
      description: Validate a CreateDataContract request against the target entity without creating the contract. Returns comprehensive validation results including constraint errors and schema field mismatches.
      operationId: validateDataContractRequest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataContract'
          application/yaml:
            schema:
              $ref: '#/components/schemas/CreateDataContract'
          text/yaml:
            schema:
              $ref: '#/components/schemas/CreateDataContract'
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractValidation'
        '400':
          description: Invalid request
  /v1/dataContracts/validate/yaml:
    post:
      tags:
      - Data Contracts
      summary: Validate data contract request from YAML without creating
      description: Validate a CreateDataContract YAML request against the target entity without creating the contract. Returns comprehensive validation results including entity errors, constraint errors, and schema field mismatches.
      operationId: validateDataContractRequestYaml
      requestBody:
        content:
          application/yaml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractValidation'
        '400':
          description: Invalid YAML content
  /v1/dataContracts/odcs/validate/yaml:
    post:
      tags:
      - Data Contracts
      summary: Validate ODCS YAML without importing
      description: Validate an ODCS YAML contract against the target entity without creating the contract. Returns comprehensive validation results including entity errors, constraint errors, and schema field mismatches.
      operationId: validateODCSYaml
      parameters:
      - name: entityId
        in: query
        description: Entity ID to validate against
        schema:
          type: string
          format: uuid
      - name: entityType
        in: query
        description: Entity Type (table, topic, etc.)
        schema:
          type: string
          example: table
      - name: objectName
        in: query
        description: Schema object name to validate (for multi-object ODCS contracts). If not specified, auto-selects based on entity name or uses first object.
        schema:
          type: string
      requestBody:
        content:
          application/yaml:
            schema:
              type: string
          text/yaml:
            schema:
              type: string
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractValidation'
        '400':
          description: Invalid YAML content
