openapi: 3.0.1
info:
  title: OpenMetadata APIs Agent Executions Stored Procedures API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.13'
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Stored Procedures
  description: A `StoredProcedure` entity that contains the set of code statements with an assigned name .
paths:
  /v1/storedProcedures/{id}/followers:
    put:
      tags:
      - Stored Procedures
      summary: Add a follower
      description: Add a user identified by `userId` as followed of this Stored Procedure
      operationId: addFollower_6
      parameters:
      - name: id
        in: path
        description: Id of the StoredProcedure
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
              format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: StoredProcedure for instance {id} is not found
  /v1/storedProcedures/bulk:
    put:
      tags:
      - Stored Procedures
      summary: Bulk create or update storedProcedures
      description: Create or update multiple storedProcedures in a single operation. Returns a BulkOperationResult with success/failure details for each storedProcedure.
      operationId: bulkCreateOrUpdateStoredProcedures
      parameters:
      - name: async
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateStoredProcedure'
      responses:
        '200':
          description: Bulk operation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '202':
          description: Bulk operation accepted for async processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationResult'
        '400':
          description: Bad request
  /v1/storedProcedures:
    get:
      tags:
      - Stored Procedures
      summary: List Stored Procedures
      description: Get a list of stored procedures, optionally filtered by `databaseSchema` it belongs to. Use `fields` parameter to get only necessary fields. Use cursor-based pagination to limit the number entries in the list using `limit` and `before` or `after` query params.
      operationId: listStoredProcedures
      parameters:
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,tags,followers,votes,extension,domains,sourceHash
      - name: databaseSchema
        in: query
        description: Filter stored procedures by database schema
        schema:
          type: string
          example: customerDatabaseSchema
      - name: limit
        in: query
        description: Limit the number schemas returned. (1 to 1000000, default = 10)
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of schemas before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of schemas after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: List of stored  procedures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredProcedureList'
    put:
      tags:
      - Stored Procedures
      summary: Create or update Stored Procedure
      description: Create a stored procedure, if it does not exist or update an existing stored procedure.
      operationId: createOrUpdateStoredProcedure
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoredProcedure'
      responses:
        '200':
          description: 'The updated schema '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredProcedure'
    post:
      tags:
      - Stored Procedures
      summary: Create a Stored Procedure
      description: Create a Stored Procedure under an existing `service`.
      operationId: createStoredProcedure
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoredProcedure'
      responses:
        '200':
          description: The Stored Procedure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredProcedure'
        '400':
          description: Bad request
  /v1/storedProcedures/name/{fqn}:
    get:
      tags:
      - Stored Procedures
      summary: Get a Stored Procedure by fully qualified name
      description: Get a Stored Procedure by fully qualified name.
      operationId: getStoredProcedureByFQN
      parameters:
      - name: fqn
        in: path
        description: Fully qualified name of the Stored Procedure
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,tags,followers,votes,extension,domains,sourceHash
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredProcedure'
        '404':
          description: Stored Procedure for instance {fqn} is not found
    delete:
      tags:
      - Stored Procedures
      summary: Delete a schema by fully qualified name
      description: Delete a schema by `fullyQualifiedName`. Schema can only be deleted if it has no tables.
      operationId: deleteDBSchemaByFQN_1
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: fqn
        in: path
        description: Name of the DBSchema
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: Schema for instance {fqn} is not found
    patch:
      tags:
      - Stored Procedures
      summary: Update a Stored Procedure by name.
      description: Update an existing StoredProcedure using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchStoredProcedure
      parameters:
      - name: fqn
        in: path
        description: Stored Procedure name
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/storedProcedures/{id}:
    get:
      tags:
      - Stored Procedures
      summary: Get a stored procedure by Id
      description: Get a stored procedure by `Id`.
      operationId: getStoredProcedureByID
      parameters:
      - name: id
        in: path
        description: Stored Procedure Id
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,tags,followers,votes,extension,domains,sourceHash
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: The Stored Procedure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredProcedure'
        '404':
          description: Schema for instance {id} is not found
    delete:
      tags:
      - Stored Procedures
      summary: Delete a StoredProcedure by Id
      description: Delete a StoredProcedure by `Id`.
      operationId: deleteStoredProcedure
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Database schema Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: StoredProcedure for instance {id} is not found
    patch:
      tags:
      - Stored Procedures
      summary: Update a Stored Procedure
      description: Update an existing StoredProcedure using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchStoredProcedure_1
      parameters:
      - name: id
        in: path
        description: Stored Procedure Id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/storedProcedures/async/{id}:
    delete:
      tags:
      - Stored Procedures
      summary: Asynchronously delete a StoredProcedure by Id
      description: Asynchronously delete a StoredProcedure by `Id`.
      operationId: deleteStoredProcedureAsync
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Database schema Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: StoredProcedure for instance {id} is not found
  /v1/storedProcedures/{id}/followers/{userId}:
    delete:
      tags:
      - Stored Procedures
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the Stored Procedure.
      operationId: deleteFollower_8
      parameters:
      - name: id
        in: path
        description: Id of the Stored Procedure
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/storedProcedures/{id}/versions/{version}:
    get:
      tags:
      - Stored Procedures
      summary: Get a version of the Stored Procedure
      description: Get a version of the Stored Procedure by given `Id`
      operationId: getSpecificStoredProcedureVersion
      parameters:
      - name: id
        in: path
        description: Stored Procedure Id
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: Stored Procedure version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: database schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredProcedure'
        '404':
          description: Stored Procedure for instance {id} and version {version} is not found
  /v1/storedProcedures/history:
    get:
      tags:
      - Stored Procedures
      summary: List all entity versions within a time range
      description: 'Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch. '
      operationId: listAllEntityVersionsByTimestamp_15
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/storedProcedures/{id}/versions:
    get:
      tags:
      - Stored Procedures
      summary: List stored procedure versions
      description: Get a list of all the versions of a stored procedure identified by `Id`
      operationId: listAllStoredProceduresVersion
      parameters:
      - name: id
        in: path
        description: Stored Procedure Id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of schema versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/storedProcedures/restore:
    put:
      tags:
      - Stored Procedures
      summary: Restore a soft deleted stored procedure.
      description: Restore a soft deleted stored procedure.
      operationId: restore_14
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: 'Successfully restored the StoredProcedure '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredProcedure'
  /v1/storedProcedures/{id}/vote:
    put:
      tags:
      - Stored Procedures
      summary: Update Vote for a Entity
      description: Update vote for a Entity
      operationId: updateVoteForEntity_4
      parameters:
      - name: id
        in: path
        description: Id of the Entity
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: model for instance {id} is not found
components:
  schemas:
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    BulkOperationResult:
      type: object
      properties:
        dryRun:
          type: boolean
        status:
          type: string
          enum:
          - success
          - failure
          - aborted
          - partialSuccess
          - running
        abortReason:
          type: string
        numberOfRowsProcessed:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          format: int32
        numberOfRowsPassed:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          format: int32
        numberOfRowsFailed:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          format: int32
        successRequest:
          type: array
          items:
            $ref: '#/components/schemas/BulkResponse'
        failedRequest:
          type: array
          items:
            $ref: '#/components/schemas/BulkResponse'
    ChangeSummaryMap:
      type: object
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    FieldChange:
      type: object
      properties:
        name:
          type: string
        oldValue:
          type: object
        newValue:
          type: object
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    LifeCycle:
      type: object
      properties:
        created:
          $ref: '#/components/schemas/AccessDetails'
        updated:
          $ref: '#/components/schemas/AccessDetails'
        accessed:
          $ref: '#/components/schemas/AccessDetails'
    EntityHistory:
      required:
      - entityType
      - versions
      type: object
      properties:
        entityType:
          type: string
        versions:
          type: array
          items:
            type: object
    AssetCertification:
      required:
      - appliedDate
      - expiryDate
      - tagLabel
      type: object
      properties:
        tagLabel:
          $ref: '#/components/schemas/TagLabel'
        appliedDate:
          type: integer
          format: int64
        expiryDate:
          type: integer
          format: int64
    VoteRequest:
      type: object
      properties:
        updatedVoteType:
          type: string
          enum:
          - votedUp
          - votedDown
          - unVoted
    StoredProcedureCode:
      type: object
      properties:
        language:
          type: string
          enum:
          - SQL
          - Java
          - JavaScript
          - Python
          - External
        code:
          type: string
    ResultList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    BulkResponse:
      type: object
      properties:
        request:
          type: object
        message:
          type: string
        status:
          type: integer
          format: int32
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    JsonPatch:
      type: object
    ChangeDescription:
      type: object
      properties:
        fieldsAdded:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsUpdated:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsDeleted:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        previousVersion:
          type: number
          format: double
        changeSummary:
          $ref: '#/components/schemas/ChangeSummaryMap'
    ChangeEvent:
      required:
      - entityId
      - entityType
      - eventType
      - id
      - timestamp
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - entityCreated
          - entityUpdated
          - entityFieldsChanged
          - entityNoChange
          - entitySoftDeleted
          - entityDeleted
          - entityRestored
          - threadCreated
          - threadUpdated
          - postCreated
          - postUpdated
          - taskResolved
          - taskClosed
          - logicalTestCaseAdded
          - suggestionCreated
          - suggestionUpdated
          - suggestionAccepted
          - suggestionRejected
          - suggestionDeleted
          - userLogin
          - userLogout
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        domains:
          type: array
          items:
            type: string
            format: uuid
        entityFullyQualifiedName:
          type: string
        previousVersion:
          type: number
          format: double
        currentVersion:
          type: number
          format: double
        userName:
          type: string
        impersonatedBy:
          type: string
        timestamp:
          type: integer
          format: int64
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        entity:
          type: object
    UsageStats:
      required:
      - count
      type: object
      properties:
        count:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          format: int32
        percentileRank:
          type: number
          format: double
    StoredProcedure:
      required:
      - id
      - name
      - storedProcedureCode
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::).)*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        description:
          type: string
        storedProcedureCode:
          $ref: '#/components/schemas/StoredProcedureCode'
        version:
          type: number
          format: double
        dataProducts:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataContract:
          $ref: '#/components/schemas/EntityReference'
        updatedAt:
          type: integer
          format: int64
        storedProcedureType:
          type: string
          enum:
          - StoredProcedure
          - UDF
          - StoredPackage
          - Function
        updatedBy:
          type: string
        impersonatedBy:
          type: string
        href:
          type: string
          format: uri
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        databaseSchema:
          $ref: '#/components/schemas/EntityReference'
        database:
          $ref: '#/components/schemas/EntityReference'
        service:
          $ref: '#/components/schemas/EntityReference'
        serviceType:
          type: string
          enum:
          - BigQuery
          - BigTable
          - Mysql
          - Redshift
          - Snowflake
          - Postgres
          - Timescale
          - Mssql
          - MicrosoftAccess
          - Oracle
          - Athena
          - Hive
          - Impala
          - Presto
          - Trino
          - Vertica
          - Glue
          - MariaDB
          - Druid
          - Db2
          - Clickhouse
          - Databricks
          - AzureSQL
          - DynamoDB
          - SingleStore
          - SQLite
          - DeltaLake
          - Salesforce
          - PinotDB
          - Datalake
          - DomoDatabase
          - QueryLog
          - CustomDatabase
          - Dbt
          - SapHana
          - SapSuccessFactors
          - MongoDB
          - Cassandra
          - Couchbase
          - Greenplum
          - Doris
          - StarRocks
          - UnityCatalog
          - SAS
          - Teradata
          - SapErp
          - Synapse
          - Exasol
          - Cockroach
          - SSAS
          - Epic
          - ServiceNow
          - Dremio
          - MicrosoftFabric
          - BurstIQ
          - Informix
          - Iomete
          - QuestDB
        deleted:
          type: boolean
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        followers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        votes:
          $ref: '#/components/schemas/Votes'
        code:
          type: string
        tags:
