openapi: 3.0.1
info:
  title: OpenMetadata APIs Agent Executions Dashboard Services API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.13'
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Dashboard Services
paths:
  /v1/services/dashboardServices/{id}/followers:
    put:
      tags:
      - Dashboard Services
      summary: Add a follower
      description: Add a user identified by `userId` as followed of this Dashboard service
      operationId: addFollowerToDashboardService
      parameters:
      - name: id
        in: path
        description: Id of the Dashboard Service
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Id of the user to be added as follower
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
        '404':
          description: Dashboard Service for instance {id} is not found
  /v1/services/dashboardServices/{id}/testConnectionResult:
    put:
      tags:
      - Dashboard Services
      summary: Add test connection result
      description: Add test connection result to the service.
      operationId: addTestConnectionResult_1
      parameters:
      - name: id
        in: path
        description: Id of the service
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestConnectionResult'
      responses:
        '200':
          description: Successfully updated the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardService'
  /v1/services/dashboardServices:
    get:
      tags:
      - Dashboard Services
      summary: List dashboard services
      description: Get a list of dashboard services.
      operationId: listDashboardsService
      parameters:
      - name: name
        in: query
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,domains,followers
      - name: domain
        in: query
        description: Filter services by domain
        schema:
          type: string
          example: Marketing
      - name: limit
        in: query
        schema:
          maximum: 1000000
          minimum: 0
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of dashboard services before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of dashboard services after this cursor
        schema:
          type: string
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      responses:
        '200':
          description: List of dashboard service instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardServiceList'
    put:
      tags:
      - Dashboard Services
      summary: Update a dashboard service
      description: Update an existing dashboard service identified by `Id`.
      operationId: createOrUpdateDashboardService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardService'
      responses:
        '200':
          description: Dashboard service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardService'
        '400':
          description: Bad request
    post:
      tags:
      - Dashboard Services
      summary: Create a dashboard service
      description: Create a new dashboard service.
      operationId: createDashboardService
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardService'
      responses:
        '200':
          description: Dashboard service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardService'
        '400':
          description: Bad request
  /v1/services/dashboardServices/name/{name}:
    get:
      tags:
      - Dashboard Services
      summary: Get dashboard service by name
      description: Get a dashboard service by the service `name`.
      operationId: getDashboardServiceByFQN
      parameters:
      - name: name
        in: path
        description: Name of the dashboard service
        required: true
        schema:
          type: string
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,domains,followers
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: Dashboard service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardService'
        '404':
          description: Dashboard service for instance {name} is not found
    delete:
      tags:
      - Dashboard Services
      summary: Delete a dashboard service by name
      description: Delete a Dashboard services by `name`. If dashboard (and charts) belong to the service, it can't be deleted.
      operationId: deleteDashboardServiceByName
      parameters:
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: name
        in: path
        description: Name of the dashboard service
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '404':
          description: DashboardService service for instance {name} is not found
  /v1/services/dashboardServices/{id}:
    get:
      tags:
      - Dashboard Services
      summary: Get a dashboard service by Id
      description: Get a dashboard service by `Id`.
      operationId: getDashboardServiceByID
      parameters:
      - name: id
        in: path
        description: Id of the dashboard service
        required: true
        schema:
          type: string
          format: uuid
      - name: fields
        in: query
        description: Fields requested in the returned resource
        schema:
          type: string
          example: owners,domains,followers
      - name: include
        in: query
        description: Include all, deleted, or non-deleted entities.
        schema:
          type: string
          default: non-deleted
          enum:
          - all
          - deleted
          - non-deleted
      - name: includeRelations
        in: query
        description: 'Per-relation include control. Format: field:value,field2:value2. Example: owners:non-deleted,followers:all. Valid values: all, deleted, non-deleted. If not specified for a field, uses the entity''s include value.'
        schema:
          type: string
          example: owners:non-deleted,followers:all
      responses:
        '200':
          description: Dashboard service instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardService'
        '404':
          description: Dashboard service for instance {id} is not found
    delete:
      tags:
      - Dashboard Services
      summary: Delete a dashboard service by Id
      description: Delete a Dashboard services. If dashboard (and charts) belong to the service, it can't be deleted.
      operationId: deleteDashboardService
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the dashboard service
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: DashboardService service for instance {id} is not found
    patch:
      tags:
      - Dashboard Services
      summary: Update a dashboard service
      description: Update an existing dashboard service using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchDashboardService_1
      parameters:
      - name: id
        in: path
        description: Id of the dashboard service
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/services/dashboardServices/async/{id}:
    delete:
      tags:
      - Dashboard Services
      summary: Asynchronously delete a dashboard service by Id
      description: Asynchronously delete a Dashboard services. If dashboard (and charts) belong to the service, it can't be deleted.
      operationId: deleteDashboardServiceAsync
      parameters:
      - name: recursive
        in: query
        description: Recursively delete this entity and it's children. (Default `false`)
        schema:
          type: boolean
          default: false
      - name: hardDelete
        in: query
        description: Hard delete the entity. (Default = `false`)
        schema:
          type: boolean
          default: false
      - name: id
        in: path
        description: Id of the dashboard service
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
        '404':
          description: DashboardService service for instance {id} is not found
  /v1/services/dashboardServices/{id}/followers/{userId}:
    delete:
      tags:
      - Dashboard Services
      summary: Remove a follower
      description: Remove the user identified `userId` as a follower of the entity.
      operationId: deleteFollower_16
      parameters:
      - name: id
        in: path
        description: Id of the Entity
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        description: Id of the user being removed as follower
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeEvent'
  /v1/services/dashboardServices/{id}/versions/{version}:
    get:
      tags:
      - Dashboard Services
      summary: Get a version of the dashboard service
      description: Get a version of the dashboard service by given `Id`
      operationId: getSpecificDashboardServiceVersion
      parameters:
      - name: id
        in: path
        description: Id of the dashboard service
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        description: dashboard service version number in the form `major`.`minor`
        required: true
        schema:
          type: string
          example: 0.1 or 1.1
      responses:
        '200':
          description: dashboard service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardService'
        '404':
          description: Dashboard service for instance {id} and version {version} is not found
  /v1/services/dashboardServices/history:
    get:
      tags:
      - Dashboard Services
      summary: List all entity versions within a time range
      description: 'Get a paginated list of all entity versions within a given time range specified by `startTs` and `endTs` in milliseconds since epoch. '
      operationId: listAllEntityVersionsByTimestamp_41
      parameters:
      - name: startTs
        in: query
        description: Start timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: endTs
        in: query
        description: End timestamp in milliseconds since epoch
        required: true
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        description: Limit the number of entity returned (1 to 1000000, default = 10)
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 10
      - name: before
        in: query
        description: Returns list of entity versions before this cursor
        schema:
          type: string
      - name: after
        in: query
        description: Returns list of entity versions after this cursor
        schema:
          type: string
      responses:
        '200':
          description: List of all versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultList'
  /v1/services/dashboardServices/{id}/versions:
    get:
      tags:
      - Dashboard Services
      summary: List dashboard service versions
      description: Get a list of all the versions of a dashboard service identified by `Id`
      operationId: listAllDashboardServiceVersion
      parameters:
      - name: id
        in: path
        description: Id of the dashboard service
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of dashboard service versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityHistory'
  /v1/services/dashboardServices/name/{fqn}:
    patch:
      tags:
      - Dashboard Services
      summary: Update a dashboard service using name.
      description: Update an existing dashboard service using JsonPatch.
      externalDocs:
        description: JsonPatch RFC
        url: https://tools.ietf.org/html/rfc6902
      operationId: patchDashboardService
      parameters:
      - name: fqn
        in: path
        description: Name of the dashboard service
        required: true
        schema:
          type: string
      requestBody:
        description: JsonPatch with array of operations
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/JsonPatch'
            example: '[{op:remove, path:/a},{op:add, path: /b, value: val}]'
      responses:
        default:
          description: default response
          content:
            application/json: {}
  /v1/services/dashboardServices/restore:
    put:
      tags:
      - Dashboard Services
      summary: Restore a soft deleted dashboard service
      description: Restore a soft deleted dashboard service.
      operationId: restore_31
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreEntity'
      responses:
        '200':
          description: 'Successfully restored the Chart '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardService'
components:
  schemas:
    TagLabelRecognizerMetadata:
      required:
      - recognizerId
      - recognizerName
      - score
      type: object
      properties:
        recognizerId:
          type: string
          format: uuid
        recognizerName:
          type: string
        score:
          type: number
          format: double
        target:
          type: string
          enum:
          - content
          - column_name
        patterns:
          type: array
          items:
            $ref: '#/components/schemas/PatternMatch'
    DashboardServiceList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DashboardService'
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    CreateDashboardService:
      required:
      - name
      - serviceType
      type: object
      properties:
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::).)*$
          type: string
        displayName:
          type: string
        description:
          type: string
        serviceType:
          type: string
          enum:
          - Superset
          - Looker
          - Tableau
          - Redash
          - Metabase
          - PowerBI
          - PowerBIReportServer
          - Mode
          - CustomDashboard
          - DomoDashboard
          - QuickSight
          - QlikSense
          - Lightdash
          - MicroStrategy
          - QlikCloud
          - Sigma
          - ThoughtSpot
          - Grafana
          - Hex
          - Ssrs
          - SapS4Hana
        connection:
          $ref: '#/components/schemas/DashboardConnection'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagLabel'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        dataProducts:
          type: array
          items:
            type: string
        domains:
          type: array
          items:
            type: string
        ingestionRunner:
          $ref: '#/components/schemas/EntityReference'
        extension:
          type: object
        reviewers:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        lifeCycle:
          $ref: '#/components/schemas/LifeCycle'
    ChangeSummaryMap:
      type: object
    AccessDetails:
      required:
      - timestamp
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        accessedBy:
          $ref: '#/components/schemas/EntityReference'
        accessedByAProcess:
          type: string
    RestoreEntity:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
    CoverImage:
      type: object
      properties:
        url:
          type: string
        position:
          type: string
    FieldChange:
      type: object
      properties:
        name:
          type: string
        oldValue:
          type: object
        newValue:
          type: object
    DashboardConnection:
      type: object
      properties:
        config:
          type: object
    LifeCycle:
      type: object
      properties:
        created:
          $ref: '#/components/schemas/AccessDetails'
        updated:
          $ref: '#/components/schemas/AccessDetails'
        accessed:
          $ref: '#/components/schemas/AccessDetails'
    EntityHistory:
      required:
      - entityType
      - versions
      type: object
      properties:
        entityType:
          type: string
        versions:
          type: array
          items:
            type: object
    AssetCertification:
      required:
      - appliedDate
      - expiryDate
      - tagLabel
      type: object
      properties:
        tagLabel:
          $ref: '#/components/schemas/TagLabel'
        appliedDate:
          type: integer
          format: int64
        expiryDate:
          type: integer
          format: int64
    ResultList:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        paging:
          $ref: '#/components/schemas/Paging'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
        warningsCount:
          type: integer
          format: int32
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/EntityError'
    Paging:
      required:
      - total
      type: object
      properties:
        before:
          type: string
        after:
          type: string
        offset:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
    TestConnectionResult:
      required:
      - steps
      type: object
      properties:
        lastUpdatedAt:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - Successful
          - Failed
          - Running
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TestConnectionStepResult'
    JsonPatch:
      type: object
    ChangeDescription:
      type: object
      properties:
        fieldsAdded:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsUpdated:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        fieldsDeleted:
          type: array
          items:
            $ref: '#/components/schemas/FieldChange'
        previousVersion:
          type: number
          format: double
        changeSummary:
          $ref: '#/components/schemas/ChangeSummaryMap'
    ChangeEvent:
      required:
      - entityId
      - entityType
      - eventType
      - id
      - timestamp
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - entityCreated
          - entityUpdated
          - entityFieldsChanged
          - entityNoChange
          - entitySoftDeleted
          - entityDeleted
          - entityRestored
          - threadCreated
          - threadUpdated
          - postCreated
          - postUpdated
          - taskResolved
          - taskClosed
          - logicalTestCaseAdded
          - suggestionCreated
          - suggestionUpdated
          - suggestionAccepted
          - suggestionRejected
          - suggestionDeleted
          - userLogin
          - userLogout
        entityType:
          type: string
        entityId:
          type: string
          format: uuid
        domains:
          type: array
          items:
            type: string
            format: uuid
        entityFullyQualifiedName:
          type: string
        previousVersion:
          type: number
          format: double
        currentVersion:
          type: number
          format: double
        userName:
          type: string
        impersonatedBy:
          type: string
        timestamp:
          type: integer
          format: int64
        changeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        incrementalChangeDescription:
          $ref: '#/components/schemas/ChangeDescription'
        entity:
          type: object
    UsageStats:
      required:
      - count
      type: object
      properties:
        count:
          minimum: 0
          exclusiveMinimum: false
          type: integer
          format: int32
        percentileRank:
          type: number
          format: double
    Style:
      type: object
      properties:
        color:
          type: string
        iconURL:
          type: string
        coverImage:
          $ref: '#/components/schemas/CoverImage'
    Votes:
      type: object
      properties:
        upVotes:
          type: integer
          format: int32
        downVotes:
          type: integer
          format: int32
        upVoters:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
        downVoters:
          type: array
          items:
            $ref: '#/components/schemas/EntityReference'
    TagLabel:
      required:
      - labelType
      - source
      - state
      - tagFQN
      type: object
      properties:
        tagFQN:
          type: string
        name:
          type: string
        displayName:
          type: string
        description:
          type: string
        style:
          $ref: '#/components/schemas/Style'
        source:
          type: string
          enum:
          - Classification
          - Glossary
        labelType:
          type: string
          enum:
          - Manual
          - Propagated
          - Automated
          - Derived
          - Generated
        state:
          type: string
          enum:
          - Suggested
          - Confirmed
        href:
          type: string
          format: uri
        reason:
          type: string
        appliedAt:
          type: string
          format: date-time
        appliedBy:
          type: string
        metadata:
          $ref: '#/components/schemas/TagLabelMetadata'
    PatternMatch:
      required:
      - name
      - score
      type: object
      properties:
        name:
          type: string
        regex:
          type: string
        score:
          type: number
          format: double
    TagLabelMetadata:
      type: object
      properties:
        recognizer:
          $ref: '#/components/schemas/TagLabelRecognizerMetadata'
        expiryDate:
          type: integer
          format: int64
    EntityError:
      type: object
      properties:
        message:
          type: string
        entity:
          type: object
    TestConnectionStepResult:
      required:
      - mandatory
      - name
      - passed
      type: object
      properties:
        name:
          type: string
        mandatory:
          type: boolean
        passed:
          type: boolean
        message:
          type: string
        errorLog:
          type: string
    DashboardService:
      required:
      - id
      - name
      - serviceType
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          maxLength: 256
          minLength: 1
          pattern: ^((?!::).)*$
          type: string
        fullyQualifiedName:
          maxLength: 3072
          minLength: 1
          type: string
        displayName:
          type: string
        serviceType:
          type: string
          enum:
          - Superset
          - Looker
          - Tableau
          - Redash
          - Metabase
          - PowerBI
          - PowerBIReportServer
          - Mode
          - CustomDashboard
          - DomoDashboard
          - QuickSight
          - QlikSense
          - Lightdash
          - MicroStrategy
          - QlikCloud
          - Sigma
          - ThoughtSpot
          - Grafana
          - Hex
