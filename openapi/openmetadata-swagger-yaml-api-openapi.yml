openapi: 3.2.0
info:
  title: OpenMetadata Swagger.yaml API
  description: Common types and API definition for OpenMetadata
  contact:
    name: OpenMetadata
    url: https://open-metadata.org
    email: openmetadata-dev@googlegroups.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  version: '1.13'
servers:
- url: /api
  description: Current Host
- url: http://localhost:8585/api
  description: Endpoint URL
security:
- BearerAuth: []
tags:
- name: Swagger.yaml
paths:
  /swagger.yaml:
    get:
      operationId: getOpenApiYaml
      responses:
        default:
          description: default response
          content:
            application/yaml: {}
      tags:
      - Swagger.yaml
      summary: Get open api yaml
      x-summary-source: derived
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
